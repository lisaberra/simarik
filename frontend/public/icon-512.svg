<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#fdf2f8"/>
      <stop offset="50%" stopColor="#f3e8ff"/>
      <stop offset="100%" stopColor="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="body" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#c8f1ee"/>
      <stop offset="45%" stopColor="#8fd6d3"/>
      <stop offset="100%" stopColor="#4fa7ad"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#d6a6f5"/>
      <stop offset="100%" stopColor="#a265d6"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#e05aa8"/>
      <stop offset="60%" stopColor="#f472c6"/>
      <stop offset="100%" stopColor="#fbb6e4"/>
    </linearGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#7cc3ff"/>
      <stop offset="60%" stopColor="#2f6fd6"/>
      <stop offset="100%" stopColor="#1b3a8a"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95"/>
      <stop offset="60%" stopColor="#ffe4d6" stopOpacity="0.8"/>
      <stop offset="100%" stopColor="#fbcfe8" stopOpacity="0.6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Character Group Centered -->
  <g transform="translate(16, 24)" filter="url(#shadow)">
    <!-- Wings -->
    <path d="M190 280 C110 200 60 220 70 270 C80 315 140 320 190 295 Z" fill="url(#wing)" stroke="#ffffff" stroke-width="3"/>
    <path d="M290 280 C370 200 420 220 410 270 C400 315 340 320 290 295 Z" fill="url(#wing)" stroke="#ffffff" stroke-width="3"/>

    <!-- Hair -->
    <path d="M170 160 C155 110 180 75 200 100 C195 50 240 30 250 80 C265 25 315 40 300 90 C330 50 365 80 340 120 C375 110 380 155 350 170 Z" fill="url(#hair)"/>

    <!-- Ears -->
    <path d="M140 190 L95 145 L160 160 Z" fill="#7fcfcc"/>
    <path d="M135 180 L110 155 L150 165 Z" fill="#f9a8d4" opacity="0.85"/>
    <path d="M340 190 L385 145 L320 160 Z" fill="#7fcfcc"/>
    <path d="M345 180 L370 155 L330 165 Z" fill="#f9a8d4" opacity="0.85"/>

    <!-- Body -->
    <ellipse cx="240" cy="330" rx="90" ry="85" fill="url(#body)"/>
    <!-- Head -->
    <ellipse cx="240" cy="225" rx="115" ry="105" fill="url(#body)"/>

    <!-- Spots -->
    <ellipse cx="200" cy="330" rx="26" ry="32" fill="url(#spot)"/>
    <ellipse cx="280" cy="355" rx="24" ry="28" fill="url(#spot)"/>
    <ellipse cx="265" cy="295" rx="18" ry="18" fill="url(#spot)"/>
    <ellipse cx="215" cy="390" rx="18" ry="15" fill="url(#spot)"/>

    <!-- Feet -->
    <ellipse cx="205" cy="415" rx="26" ry="18" fill="#a265d6"/>
    <ellipse cx="275" cy="415" rx="26" ry="18" fill="#a265d6"/>

    <!-- Eyes -->
    <ellipse cx="190" cy="225" rx="36" ry="42" fill="#ffffff"/>
    <ellipse cx="290" cy="225" rx="36" ry="42" fill="#ffffff"/>

    <circle cx="193" cy="230" rx="26" ry="26" fill="url(#iris)"/>
    <circle cx="293" cy="230" rx="26" ry="26" fill="url(#iris)"/>
    <circle cx="193" cy="232" r="13" fill="#0b1640"/>
    <circle cx="293" cy="232" r="13" fill="#0b1640"/>
    <circle cx="202" cy="218" r="8" fill="#ffffff"/>
    <circle cx="302" cy="218" r="8" fill="#ffffff"/>
    <circle cx="184" cy="242" r="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="284" cy="242" r="4" fill="#ffffff" opacity="0.85"/>

    <!-- Eyelashes & Brows -->
    <path d="M152 215 Q190 178 226 215" fill="none" stroke="#2c4d50" stroke-width="6" stroke-linecap="round"/>
    <path d="M156 205 L140 192 M168 195 L158 178" stroke="#2c4d50" stroke-width="5" stroke-linecap="round"/>
    <path d="M254 215 Q290 178 328 215" fill="none" stroke="#2c4d50" stroke-width="6" stroke-linecap="round"/>
    <path d="M324 205 L340 192 M312 195 L322 178" stroke="#2c4d50" stroke-width="5" stroke-linecap="round"/>

    <!-- Cheeks -->
    <ellipse cx="155" cy="270" rx="20" ry="13" fill="#f9a8d4" opacity="0.6"/>
    <ellipse cx="325" cy="270" rx="20" ry="13" fill="#f9a8d4" opacity="0.6"/>

    <!-- Nose -->
    <path d="M228 260 Q240 252 252 260 Q240 274 228 260 Z" fill="#f472b6"/>

    <!-- Mouth -->
    <path d="M212 280 Q240 315 268 280 Q240 295 212 280 Z" fill="#7a1f4f"/>
    <path d="M225 292 Q240 305 255 292" fill="#f472b6"/>

    <!-- Sparkles -->
    <g fill="#fde047">
      <path d="M80 120 Q80 140 60 140 Q80 140 80 160 Q80 140 100 140 Q80 140 80 120 Z"/>
      <path d="M410 100 Q410 115 395 115 Q410 115 410 130 Q410 115 425 115 Q410 115 410 100 Z" transform="scale(0.8) translate(80, 20)"/>
      <path d="M390 380 Q390 395 375 395 Q390 395 390 410 Q390 395 405 395 Q390 395 390 380 Z" transform="scale(0.9) translate(30, 20)"/>
    </g>
  </g>
</svg>
